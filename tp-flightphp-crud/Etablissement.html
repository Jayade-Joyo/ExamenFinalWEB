<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des établissements financiers</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-container { margin-bottom: 20px; }
        .form-container input, .form-container button { margin: 5px; }
        .error { color: red; }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h2>Gestion des établissements financiers</h2>

    <div class="form-container">
        <h3>Ajouter / Modifier un établissement</h3>
        <input type="hidden" id="id_etablissement">
        <input type="text" id="nom_etablissement" placeholder="Nom de l'établissement" required>
        <input type="text" id="adresse" placeholder="Adresse">
        <input type="text" id="telephone" placeholder="Téléphone">
        <input type="email" id="email" placeholder="Email">
        <input type="date" id="date_creation" placeholder="Date de création">
        <input type="number" id="solde" placeholder="Solde initial" step="0.01">
        <input type="number" id="montant_depot" placeholder="Montant dépôt" step="0.01">
        <button onclick="saveEtablissement()">Enregistrer</button>
        <button onclick="resetForm()">Annuler</button>
        <span id="error-message" class="error"></span>
    </div>

    <table id="etablissements-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Adresse</th>
                <th>Téléphone</th>
                <th>Email</th>
                <th>Date création</th>
                <th>Solde</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const apiBase = "http://localhost/Projet/ExamenFinalWEB/tp-flightphp-crud/ws";
        $(document).ready(function() {
            loadEtablissements();

            // Load establishments
            function loadEtablissements() {
                $.get('/etablissements', function(data) {
                    const tbody = $('#etablissements-table tbody');
                    tbody.empty();
                    data.forEach(etab => {
                        tbody.append(`
                            <tr>
                                <td>${etab.id_etablissement}</td>
                                <td>${etab.nom_etablissement}</td>
                                <td>${etab.adresse || ''}</td>
                                <td>${etab.telephone || ''}</td>
                                <td>${etab.email || ''}</td>
                                <td>${etab.date_creation || ''}</td>
                                <td>${etab.solde}</td>
                                <td>
                                    <button onclick="editEtablissement(${etab.id_etablissement})">Modifier</button>
                                    <button onclick="deleteEtablissement(${etab.id_etablissement})">Supprimer</button>
                                </td>
                            </tr>
                        `);
                    });
                });
            }

            // Save or update establishment
            window.saveEtablissement = function() {
                const id = $('#id_etablissement').val();
                const montantDepot = parseFloat($('#montant_depot').val()) || 0;
                const etablissement = {
                    nom_etablissement: $('#nom_etablissement').val(),
                    adresse: $('#adresse').val(),
                    telephone: $('#telephone').val(),
                    email: $('#email').val(),
                    date_creation: $('#date_creation').val(),
                    solde: parseFloat($('#solde').val()) || 0,
                    montant_depot: montantDepot
                };

                if (!etablissement.nom_etablissement) {
                    $('#error-message').text('Le nom de l\'établissement est requis');
                    return;
                }

                const url = id ? `/etablissements/${id}` : '/etablissements';
                const method = id ? 'PUT' : 'POST';

                $.ajax({
                    url: url,
                    method: method,
                    contentType: 'application/json',
                    data: JSON.stringify(etablissement),
                    success: function(response) {
                        loadEtablissements();
                        resetForm();
                    },
                    error: function(xhr) {
                        $('#error-message').text('Erreur: ' + xhr.responseJSON.message);
                    }
                });
            };

            // Edit establishment
            window.editEtablissement = function(id) {
                $.get(`/etablissements/${id}`, function(data) {
                    $('#id_etablissement').val(data.id_etablissement);
                    $('#nom_etablissement').val(data.nom_etablissement);
                    $('#adresse').val(data.adresse);
                    $('#telephone').val(data.telephone);
                    $('#email').val(data.email);
                    $('#date_creation').val(data.date_creation);
                    $('#solde').val(data.solde);
                    $('#montant_depot').val('');
                });
            };

            // Delete establishment
            window.deleteEtablissement = function(id) {
                if (confirm('Voulez-vous vraiment supprimer cet établissement ?')) {
                    $.ajax({
                        url: `/etablissements/${id}`,
                        method: 'DELETE',
                        success: function() {
                            loadEtablissements();
                        }
                    });
                }
            };

            // Reset form
            window.resetForm = function() {
                $('#id_etablissement').val('');
                $('#nom_etablissement').val('');
                $('#adresse').val('');
                $('#telephone').val('');
                $('#email').val('');
                $('#date_creation').val('');
                $('#solde').val('');
                $('#montant_depot').val('');
                $('#error-message').text('');
            };
        });
    </script>
</body>
</html>
