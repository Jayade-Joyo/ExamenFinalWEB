  <script>
    const apiBase = "http://localhost/ExamenFinalWEB/tp-flightphp-crud/ws";

    // Charger les données nécessaires pour les selects
    function chargerDonneesSelects() {
      // Ici vous devriez faire des appels AJAX pour remplir:
      // - Les clients
      // - Les types de prêt
      // - Les établissements
      // - Les statuts
      // - Les fréquences
    }

function ajax(method, url, data, callback, errorCallback) {
    const xhr = new XMLHttpRequest();
    xhr.open(method, apiBase + url, true);
    xhr.setRequestHeader("Content-Type", "application/json"); // Changer ici
    xhr.onreadystatechange = () => {
        if (xhr.readyState === 4) {
            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    callback(JSON.parse(xhr.responseText));
                } catch (e) {
                    console.error("Erreur parsing JSON:", e);
                    if (errorCallback) errorCallback({ error: "Réponse serveur invalide" }, xhr.status);
                }
            } else {
                // Gestion erreur...
                console.error("Erreur AJAX:", xhr.status, xhr.statusText);
                if (errorCallback) {
                    try {
                        const errorResponse = JSON.parse(xhr.responseText);
                        errorCallback(errorResponse, xhr.status);
                    } catch (e) {
                        errorCallback({ error: "Erreur serveur inconnue" }, xhr.status);
                    }
                } else {
                    alert(`Erreur ${xhr.status}: ${xhr.statusText}`);
                }
            }
        }
    };
    xhr.send(JSON.stringify(data)); // Envoyer les données en JSON
}

async function chargerPret() {
    try {
        const response = await fetch(`${apiBase}/pret`);
        
        // Vérifiez d'abord le content-type
        const contentType = response.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
            const text = await response.text();
            throw new Error(`Réponse non-JSON: ${text.substring(0, 100)}...`);
        }

        const prets = await response.json();
        
        const tbody = document.querySelector("#table-types-pret tbody");
        tbody.innerHTML = "";
        
        prets.forEach(pret => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${pret.id_pret}</td>
                <td>${pret.id_client}</td>
                <td>${pret.id_type_pret}</td>
                <td>${pret.id_etablissement}</td>
                <td>${pret.id_statut}</td>
                <td>${pret.id_frequence}</td>
                <td>${parseFloat(pret.montant).toFixed(2)} €</td>
                <td>${pret.date_debut}</td>
                <td>${pret.date_fin}</td>
                <td>${parseFloat(pret.montant_restant).toFixed(2)} €</td>
                <td>${new Date(pret.date_creation).toLocaleString()}</td>
                <td>
                    <button class="action-button" onclick='remplirFormulairePret(${JSON.stringify(pret)})'>✏️</button>
                    <button class="action-button delete-button" onclick='supprimerPret(${pret.id_pret})'>🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    } catch (error) {
        console.error("Erreur détaillée:", error);
        alert(`Erreur: ${error.message}`);
    }
}

      } else {

function remplirSelect(selectId, donnees, valeurAttr, texteAttr) {
  const select = document.getElementById(selectId);
  
  // Option vide par défaut
  const optionDefaut = document.createElement('option');
  optionDefaut.value = '';
  optionDefaut.textContent = `Sélectionnez...`;
  select.appendChild(optionDefaut);
  
  // Ajout des options
  donnees.forEach(item => {
    const option = document.createElement('option');
    option.value = item[valeurAttr];
    option.textContent = item[texteAttr];
    option.dataset.originalData = JSON.stringify(item); // Stockage des données complètes
    select.appendChild(option);
  });
}

document.addEventListener('DOMContentLoaded', function() {
  // Clients
  remplirSelect('id_client', donneesSelects.clients, 'id', 'nom_complet');
  
  // Types de prêt
  remplirSelect('id_type_pret', donneesSelects.typesPret, 'id', 'libelle');
  
  // Établissements

  // Statuts
  remplirSelect('id_statut', donneesSelects.statuts, 'id', 'libelle');
  
  // Fréquences
  remplirSelect('id_frequence', donneesSelects.frequences, 'id', 'libelle');
});

function getSelectedItemData(selectId) {
  const select = document.getElementById(selectId);
  const selectedOption = select.options[select.selectedIndex];
  return selectedOption.value ? JSON.parse(selectedOption.dataset.originalData) : null;
}

// Exemple d'utilisation :
document.getElementById('id_type_pret').addEventListener('change', function() {
  const typePretSelectionne = getSelectedItemData('id_type_pret');
  console.log('Type de prêt sélectionné:', typePretSelectionne);
});

function remplirSelect(selectId, donnees, valeurAttr, texteAttr) {
  try {
    const select = document.getElementById(selectId);
    if (!select) throw new Error(`Select #${selectId} introuvable`);
    
    select.innerHTML = ''; // Réinitialisation
    
    // Option par défaut
    const optionDefaut = new Option('Sélectionnez...', '');
    select.add(optionDefaut);
    
    // Validation des données
    if (!Array.isArray(donnees)) {
      console.warn(`Données invalides pour ${selectId}`, donnees);
      return;
    }
    
    // Ajout des options
    donnees.forEach(item => {
      const option = new Option(item[texteAttr], item[valeurAttr]);
      option.dataset.originalData = JSON.stringify(item);
      select.add(option);
    });
    
  } catch (error) {
    console.error(`Erreur lors du remplissage de ${selectId}:`, error);
  }
}
